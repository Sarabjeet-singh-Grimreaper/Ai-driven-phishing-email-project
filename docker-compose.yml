version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./best_phishing_model.joblib:/app/best_phishing_model.joblib
      - ./tfidf_vectorizer.joblib:/app/tfidf_vectorizer.joblib
      - ./metadata_scaler.joblib:/app/metadata_scaler.joblib
    environment:
      - PORT=8000
    restart: always

  frontend:
    build:
      context: ./ai-phishing-shield
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
